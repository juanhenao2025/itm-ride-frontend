<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITM Ride - Usuarios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }

        header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header a {
            color: white;
            text-decoration: none;
            font-size: 22px;
        }
        header h1 { font-size: 20px; }

        .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }

        .card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .card h2 {
            font-size: 17px;
            margin-bottom: 20px;
            color: #1a73e8;
            border-bottom: 2px solid #e8f0fe;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: #555; font-weight: 600; }
        .form-group input, .form-group select {
            padding: 10px 14px;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #1a73e8;
            background: white;
        }

        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-secondary { background: #f0f2f5; color: #333; }
        .btn-danger { background: #e53935; color: white; font-size: 12px; padding: 6px 14px; border-radius: 8px; }
        .btn-warning { background: #fb8c00; color: white; font-size: 12px; padding: 6px 14px; border-radius: 8px; }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #43a047; }
        .alert-error { background: #ffebee; color: #c62828; border-left: 4px solid #e53935; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            background: #e8f0fe;
            padding: 11px 14px;
            text-align: left;
            font-size: 12px;
            color: #1a73e8;
            font-weight: 700;
            text-transform: uppercase;
        }
        td { padding: 11px 14px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fbff; }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-conductor { background: #e8f5e9; color: #2e7d32; }
        .badge-pasajero { background: #e3f2fd; color: #1565c0; }

        .actions { display: flex; gap: 6px; }
        .empty { text-align: center; color: #aaa; padding: 24px; font-size: 14px; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 500px;
            max-width: 90%;
        }
        .modal h2 { font-size: 18px; color: #1a73e8; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <a href="index.html">🏠</a>
    <h1>👤 Gestión de Usuarios</h1>
</header>

<div class="container">

    <div class="card">
        <h2>➕ Registrar nuevo usuario</h2>
        <div id="alert-crear" class="alert"></div>
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" id="u-nombre" placeholder="Ej: Juan Pérez">
            </div>
            <div class="form-group">
                <label>Correo ITM</label>
                <input type="email" id="u-correo" placeholder="Ej: juan@itm.edu.co">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="u-telefono" placeholder="Ej: 3001234567">
            </div>
            <div class="form-group">
                <label>Barrio</label>
                <input type="text" id="u-barrio" placeholder="Ej: Laureles">
            </div>
            <div class="form-group">
                <label>Tipo de usuario</label>
                <select id="u-tipo">
                    <option value="PASAJERO">🧍 Pasajero</option>
                    <option value="CONDUCTOR">🚗 Conductor</option>
                </select>
            </div>
        </div>
        <button class="btn btn-primary" onclick="crearUsuario()">✅ Registrar usuario</button>
    </div>

    <div class="card">
        <h2>👥 Lista de usuarios registrados</h2>
        <div id="alert-lista" class="alert"></div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Barrio</th>
                    <th>Tipo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios"></tbody>
        </table>
    </div>
</div>

<!-- Modal Editar -->
<div class="modal-overlay" id="modal-editar">
    <div class="modal">
        <h2>✏️ Editar Usuario</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="edit-nombre">
            </div>
            <div class="form-group">
                <label>Correo</label>
                <input type="email" id="edit-correo">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="edit-telefono">
            </div>
            <div class="form-group">
                <label>Barrio</label>
                <input type="text" id="edit-barrio">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="edit-tipo">
                    <option value="PASAJERO">🧍 Pasajero</option>
                    <option value="CONDUCTOR">🚗 Conductor</option>
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarEdicion()">💾 Guardar cambios</button>
        </div>
    </div>
</div>

<script>
const API = 'http://localhost:8080/api/usuarios';
let editandoId = null;

function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'alert alert-' + type;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
}

async function cargarUsuarios() {
    const res = await fetch(API);
    const data = await res.json();
    const tbody = document.getElementById('tabla-usuarios');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No hay usuarios registrados aún</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(u => `
        <tr>
            <td><b>#${u.id}</b></td>
            <td>${u.nombre}</td>
            <td>${u.correo}</td>
            <td>${u.telefono}</td>
            <td>${u.barrio}</td>
            <td><span class="badge badge-${u.tipo.toLowerCase()}">${u.tipo}</span></td>
            <td class="actions">
                <button class="btn btn-warning" onclick="abrirEditar(${u.id},'${u.nombre}','${u.correo}','${u.telefono}','${u.barrio}','${u.tipo}')">✏️ Editar</button>
                <button class="btn btn-danger" onclick="eliminarUsuario(${u.id})">🗑️ Eliminar</button>
            </td>
        </tr>
    `).join('');
}

async function crearUsuario() {
    const usuario = {
        nombre: document.getElementById('u-nombre').value,
        correo: document.getElementById('u-correo').value,
        telefono: document.getElementById('u-telefono').value,
        barrio: document.getElementById('u-barrio').value,
        tipo: document.getElementById('u-tipo').value
    };
    if (!usuario.nombre || !usuario.correo) {
        showAlert('alert-crear', '⚠️ Completa nombre y correo', 'error');
        return;
    }
    const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(usuario)
    });
    if (res.ok) {
        showAlert('alert-crear', '✅ Usuario registrado exitosamente', 'success');
        ['u-nombre','u-correo','u-telefono','u-barrio'].forEach(id => document.getElementById(id).value = '');
        cargarUsuarios();
    } else {
        showAlert('alert-crear', '❌ Error al registrar usuario', 'error');
    }
}

function abrirEditar(id, nombre, correo, telefono, barrio, tipo) {
    editandoId = id;
    document.getElementById('edit-nombre').value = nombre;
    document.getElementById('edit-correo').value = correo;
    document.getElementById('edit-telefono').value = telefono;
    document.getElementById('edit-barrio').value = barrio;
    document.getElementById('edit-tipo').value = tipo;
    document.getElementById('modal-editar').classList.add('active');
}

function cerrarModal() {
    document.getElementById('modal-editar').classList.remove('active');
    editandoId = null;
}

async function guardarEdicion() {
    const usuario = {
        nombre: document.getElementById('edit-nombre').value,
        correo: document.getElementById('edit-correo').value,
        telefono: document.getElementById('edit-telefono').value,
        barrio: document.getElementById('edit-barrio').value,
        tipo: document.getElementById('edit-tipo').value
    };
    const res = await fetch(API + '/' + editandoId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(usuario)
    });
    if (res.ok) {
        showAlert('alert-lista', '✅ Usuario actualizado exitosamente', 'success');
        cerrarModal();
        cargarUsuarios();
    } else {
        showAlert('alert-lista', '❌ Error al actualizar usuario', 'error');
    }
}

async function eliminarUsuario(id) {
    if (!confirm('¿Seguro que deseas eliminar este usuario?')) return;
    const res = await fetch(API + '/' + id, { method: 'DELETE' });
    if (res.ok) {
        showAlert('alert-lista', '✅ Usuario eliminado', 'success');
        cargarUsuarios();
    }
}

cargarUsuarios();
</script>

</body>
</html>
